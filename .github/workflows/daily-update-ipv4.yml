name: Daily Fetch CF IPs

on:
  schedule:
    # 北京时间每天早上 04:00 自动运行
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动测试触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Fetch and Merge IPs
        run: |
          # 1. 获取 IPv4 并截取前 80 个
          curl -s https://raw.githubusercontent.com/LancelotRar/best-cf-ips/main/best-cf-ipv4.txt | head -n 80 > best-cf-ipv4.txt
          
          # 2. 运行 Python 脚本提取网页 IPv6 并与 IPv4 合并生成 best-cf-ip.txt
          python fetch_v6.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add best-cf-ipv4.txt best-cf-ip.txt
          git commit -m "Auto update merged best CF IPs" || exit 0
          git push
